name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: python -m pytest
      - run: pip-audit -r requirements.txt --disable-pip
      - run: python scripts/check_contract.py
      - run: python scripts/build.py
      - name: Verify production artifact imports
        run: cd build/lambda && python -S -c "from app.handlers import api_handler, worker_handler, reconcile_handler"
      - uses: actions/upload-artifact@v6
        with:
          name: lambda-package
          path: artifacts/lambda.zip
          retention-days: 7
  infrastructure:
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: artifacts
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform test
